<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Room | Playhouse Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .chat-container {
            max-width: 900px;
            margin: 120px auto 60px auto;
            background: var(--bg-surface);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 75vh;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s ease forwards;
        }

        .chat-header {
            padding: 20px 30px;
            background: var(--primary);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .online-count {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #2ed573;
            border-radius: 50%;
            box-shadow: 0 0 10px #2ed573;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .chat-messages {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fdf8f5;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            animation: messageSlide 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            align-self: flex-start;
            background: #ffffff;
            border: 1px solid #e2d5c8;
            color: var(--text-main);
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--bg-dark);
            color: #111;
            border-bottom-right-radius: 5px;
            font-weight: 500;
        }

        .message .sender {
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 5px;
            display: block;
            color: var(--primary);
        }

        .message.sent .sender {
            display: none;
        }

        .message .timestamp {
            font-size: 0.75rem;
            text-align: right;
            display: block;
            margin-top: 8px;
            opacity: 0.6;
        }

        .edit-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #fff;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 5;
        }

        .message.sent:hover .edit-btn {
            opacity: 1;
        }

        .edit-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .edit-indicator {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 5px;
            font-style: italic;
        }

        .editing-mode-box {
            background: rgba(233, 182, 94, 0.1) !important;
            border-color: var(--primary) !important;
        }

        .btn-exit {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-exit:hover {
            background: #ff4757;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(255, 71, 87, 0.3);
        }

        .btn-booking {
            background: #e1a642;
            color: #111111;
            border: 1px solid #e1a642;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-booking:hover {
            background: #f3c26b;
            border-color: #f3c26b;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(225, 166, 66, 0.3);
        }

        .chat-input-area {
            padding: 20px 30px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
            position: relative;
        }

        .emoji-toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-toggle-btn:hover, .emoji-toggle-btn.active {
            color: var(--primary);
            transform: scale(1.1);
        }

        .emoji-picker {
            position: absolute;
            bottom: 85px;
            left: 20px;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .emoji-picker.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .emoji-picker span {
            cursor: pointer;
            font-size: 1.6rem;
            padding: 5px;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
            user-select: none;
        }

        .emoji-picker span:hover {
            background: #fdf8f5;
            transform: scale(1.2);
        }

        .chat-input-area input {
            flex-grow: 1;
            padding: 15px 25px;
            border-radius: 30px;
            border: 2px solid #e2d5c8;
            outline: none;
            font-family: inherit;
            font-size: 1.05rem;
            background: #fdf8f5;
            transition: all 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .btn-send {
            background: var(--primary);
            color: #ffffff;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-send:hover {
            transform: scale(1.08) rotate(-5deg);
            background: #000;
        }

        /* Widget Mode Styles */
        body.widget-mode nav { display: none !important; }
        body.widget-mode { background: transparent !important; margin: 0; padding: 0; overflow: hidden; }
        body.widget-mode .chat-container {
            margin: 0 !important;
            height: 100vh !important;
            width: 100vw !important;
            max-width: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }
        .win-btn-group {
            display: none;
            gap: 5px;
            align-items: center;
            margin-left: 10px;
        }
        body.widget-mode .win-btn-group {
            display: flex;
        }
        body.widget-mode .btn-booking, body.widget-mode .btn-exit {
            display: none !important;
        }
        .win-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 5px;
        }
        .win-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .win-btn.close:hover {
            background: #ff4757;
        }

        /* Overlay for username setup */
        .join-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .join-card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 2px solid var(--primary);
        }

        .join-card h3 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        .join-card p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .join-card input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e2d5c8;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }
        
        .join-card input:focus {
            border-color: var(--primary);
        }

        .btn-join {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .system-message {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 10px 0;
            font-weight: 500;
            background: rgba(0,0,0,0.05);
            padding: 5px 15px;
            border-radius: 20px;
            align-self: center;
        }
        
        @media (max-width: 768px) {
            .chat-container { margin: 100px 10px 20px 10px; height: 80vh; border-radius: 15px; }
            .message { max-width: 85%; }
            .chat-input-area { padding: 15px; }
            .chat-header { padding: 15px 20px; }
        }
    </style>
</head>
<body>

        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Playhouse Cafe" style="height: 60px; object-fit: contain; max-width: 180px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
            <span style="display:none; align-items:center; gap:8px; font-weight:800; font-size:1.6rem; color:var(--text-main);"><i class="fa-solid fa-dice-d20" style="color:var(--primary);"></i> Playhouse<span style="color:var(--primary);">Cafe</span></span>

    <div class="chat-container">
        
        <div class="join-overlay" id="joinOverlay">
            <div class="join-card">
                <i class="fa-solid fa-users" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>

                <input type="text" id="usernameInput" placeholder="Enter your display name" maxlength="20">

        </div>

        <div class="chat-header">
            <div class="chat-header-title">
                <i class="fa-solid fa-comments" style="font-size: 1.8rem; color: #e1a642;"></i>
                Global Lounge
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="online-count">
                    <div class="online-dot"></div>
                    <span id="activeUsers">Connecting...</span>
                </div>
                <button onclick="window.location.href='checkout.html'" class="btn-booking" title="Book a Table">
                    <i class="fa-solid fa-calendar-check"></i> Book Table
                </button>

            <div class="emoji-picker" id="emojiPicker">
                <span onclick="addEmoji('😀')">😀</span>
                <span onclick="addEmoji('😂')">😂</span>

    <!-- SUPABASE CONFIGURATION -->
    <script>
        // Check for Widget Mode
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('widget') === 'true') {
            document.body.classList.add('widget-mode');
        }

        const SUPABASE_URL = 'https://viaolznkqykdhcucvwpx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpYW9sem5rcXlrZGhjdWN2d3B4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODMyMzcsImV4cCI6MjA5NjE1OTIzN30.AyVSPjGzoj3xyte7Xr63s4nvIlmWeXKZzR1wq_AD3NY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let channel = null;
        let editingMessageId = null;

        const joinOverlay = document.getElementById('joinOverlay');
        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');
        const activeUsersDisplay = document.getElementById('activeUsers');

        // Check if user is logged in
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const email = session.user.email;
                currentUser = email.split('@')[0];
                setupChatRoom();
            } else {
                // Focus input if not logged in
                usernameInput.focus();
            }
        }

        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                currentUser = name;
                setupChatRoom();
            }
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });

        function setupChatRoom() {
            joinOverlay.style.opacity = '0';
            setTimeout(() => joinOverlay.style.display = 'none', 500);
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();

            // Initialize Supabase Broadcast Channel with Presence
            channel = supabaseClient.channel('live-room', {
                config: {
                    broadcast: { self: false },
                    presence: { key: currentUser }
                }
            });

            // Listen for Messages
            channel.on('broadcast', { event: 'chat_message' }, ({ payload }) => {
                appendMessage(payload.msgId, payload.user, payload.text, false, payload.time);
            });

            // Listen for Edited Messages
            channel.on('broadcast', { event: 'edit_message' }, ({ payload }) => {
                updateMessageDOM(payload.msgId, payload.text);
            });

            // Listen for Presence changes to update active user count
            channel.on('presence', { event: 'sync' }, () => {
                const newState = channel.presenceState();
                const count = Object.keys(newState).length;
                activeUsersDisplay.innerText = `${count} Online`;
            });
            
            channel.on('presence', { event: 'join' }, ({ key, newPresences }) => {
                appendSystemMessage(`${newPresences[0].user} joined the room`);
            });

            channel.on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
                appendSystemMessage(`${leftPresences[0].user} left the room`);
            });

            // Subscribe to the channel
            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.track({ user: currentUser });
                    appendSystemMessage(`You joined as ${currentUser}`);
                }
            });
        }

        function appendMessage(msgId, user, text, isSent, timeString) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            msgDiv.id = `msg-${msgId}`;
            
            let html = '';
            if (!isSent) {
                html += `<span class="sender">${user}</span>`;
            }
            html += `<span class="msg-text">${escapeHTML(text)}</span>`;
            html += `<span class="timestamp">${timeString}</span>`;
            
            if (isSent) {
                html += `<button class="edit-btn" onclick="startEdit('${msgId}')" title="Edit Message"><i class="fa-solid fa-pen"></i></button>`;
            }
            
            msgDiv.innerHTML = html;
            chatBox.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'system-message';
            div.innerText = text;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function startEdit(msgId) {
            const msgDiv = document.getElementById(`msg-${msgId}`);
            if (!msgDiv) return;
            
            const textSpan = msgDiv.querySelector('.msg-text');
            let currentText = textSpan.innerText;
            if (currentText.endsWith('(edited)')) {
                currentText = currentText.replace('(edited)', '').trim();
            }

            editingMessageId = msgId;
            messageInput.value = currentText;
            messageInput.focus();
            
            sendBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
            sendBtn.style.background = '#2ed573';
            
            // Highlight message being edited
            document.querySelectorAll('.message').forEach(m => m.classList.remove('editing-mode-box'));
            msgDiv.classList.add('editing-mode-box');
        }

        function updateMessageDOM(msgId, newText) {
            const msgDiv = document.getElementById(`msg-${msgId}`);
            if (msgDiv) {
                const textSpan = msgDiv.querySelector('.msg-text');
                if (textSpan) {
                    textSpan.innerHTML = `${escapeHTML(newText)} <span class="edit-indicator">(edited)</span>`;
                }
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !channel) return;

            if (editingMessageId) {
                // Editing existing message
                updateMessageDOM(editingMessageId, text);
                
                channel.send({
                    type: 'broadcast',
                    event: 'edit_message',
                    payload: { msgId: editingMessageId, text: text }
                });

                document.getElementById(`msg-${editingMessageId}`).classList.remove('editing-mode-box');
                editingMessageId = null;
                sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
                sendBtn.style.background = 'var(--primary)';
            } else {
                // Sending new message
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const msgId = Date.now().toString() + Math.random().toString(36).substr(2, 9);

                appendMessage(msgId, currentUser, text, true, timeString);
                
                channel.send({
                    type: 'broadcast',
                    event: 'chat_message',
                    payload: { msgId: msgId, user: currentUser, text: text, time: timeString }
                });
            }

            messageInput.value = '';
            messageInput.focus();
        }

        function exitChat() {
            if (channel) {
                channel.unsubscribe();
            }
            window.location.href = 'index.html';
        }

        // Emoji Picker Logic
        const emojiToggleBtn = document.getElementById('emojiToggleBtn');
        const emojiPicker = document.getElementById('emojiPicker');

        emojiToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPicker.classList.toggle('active');
            emojiToggleBtn.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== emojiToggleBtn) {
                emojiPicker.classList.remove('active');
                emojiToggleBtn.classList.remove('active');
            }
        });

        function addEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize
        checkSession();
    </script>
</body>
</html>
